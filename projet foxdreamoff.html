<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FoxDreamOff | Site Officiel</title>
    
    <style>
        /* --- STYLE GLOBAL NEON ORANGE --- */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
        }

        header {
            text-align: center;
            padding: 40px;
            background: #111;
            border-bottom: 3px solid #ff6600;
            box-shadow: 0 0 25px #ff6600;
        }

        .logo-img {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid #ff6600;
            box-shadow: 0 0 15px #ff6600;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #ff6600;
            margin: 0;
        }

        .container { max-width: 1250px; margin: auto; padding: 30px; }

        h2 {
            color: #ff6600;
            text-align: left;
            border-left: 6px solid #ff6600;
            padding-left: 15px;
            text-transform: uppercase;
            margin-top: 40px;
        }

        /* --- EFFET ZOOM SUR LES PARTENARIATS --- */
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            /* Ligne importante pour l animation */
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
            color: white;
            display: block;
        }

        /* QUAND LA SOURIS PASSE DESSUS (LE ZOOM) */
        .card:hover {
            transform: scale(1.05); /* Zoom de 5% */
            border-color: #ff6600;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
            cursor: pointer;
        }

        .premium { border: 2px solid #ffcc00; }
        .premium h3 { color: #ffcc00; }
        .premium:hover { border-color: #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }

        /* --- STREAM ET CHAT --- */
        .stage { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; }
        .video-box { flex: 3; min-width: 320px; aspect-ratio: 16/9; border: 2px solid #ff6600; background: #000; border-radius: 10px; overflow: hidden; }
        .chat-box { flex: 1; min-width: 300px; height: 500px; border: 2px solid #ff6600; background: #000; border-radius: 10px; overflow: hidden; }

        .btn-orange {
            background: #ff6600; color: white; padding: 12px 25px; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none;
            display: inline-block; box-shadow: 0 0 15px #ff6600;
        }

        /* --- PANEL ADMIN --- */
        .admin-section { margin-top: 80px; padding: 40px; background: #050505; border: 2px solid #333; border-radius: 15px; text-align: center; }
        .admin-input { padding: 12px; border-radius: 5px; border: 1px solid #ff6600; background: #111; color: white; margin-bottom: 10px; width: 220px; }
        #admin-panel { display: none; margin-top: 30px; padding: 25px; border: 2px solid #ffcc00; background: rgba(20, 20, 20, 0.9); border-radius: 10px; }
        .command-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .cmd-btn { background: #222; color: #ffcc00; border: 1px solid #ffcc00; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cmd-btn:hover { background: #ffcc00; color: #000; }
        .status-msg { color: #ffcc00; margin-top: 15px; font-weight: bold; }

        footer { padding: 40px; color: #333; text-align: center; }
    </style>
</head>
<body>

<header>
    <img src="fox.jpeg" class="logo-img">
    <h1>FoxDreamOff</h1>
</header>

<div class="container">

    <div style="text-align: center; margin-bottom: 30px;">
        <a href="https://www.twitch.tv/login" target="popup" onclick="window.open('https://www.twitch.tv/login','popup','width=600,height=700'); return false;" class="btn-orange">
            ACTIVER LE LIVE ET LE CHAT
        </a>
    </div>

    <h2>Direct et Chat</h2>
    <div class="stage">
        <div class="video-box">
            <iframe src="https://player.twitch.tv/?channel=foxdreamoff&parent=localhost&parent=127.0.0.1" height="100%" width="100%" frameborder="0" allowfullscreen="true"></iframe>
        </div>
        <div class="chat-box">
            <iframe src="https://www.twitch.tv/embed/foxdreamoff/chat?parent=localhost&parent=127.0.0.1" height="100%" width="100%" frameborder="0"></iframe>
        </div>
    </div>

    <h2 style="color: #ffcc00;">Partenaires Premium</h2>
    <div class="partners-grid">
        <a href="https://www.twitch.tv/beroxs_big_twitch" target="_blank" class="card premium"><h3>beroxs_big_twitch</h3></a>
        <a href="https://www.twitch.tv/amoleboss1" target="_blank" class="card premium"><h3>amoleboss1</h3></a>
        <a href="https://www.twitch.tv/lau_lums" target="_blank" class="card premium"><h3>lau_lums</h3></a>
        <a href="https://www.twitch.tv/fan_de_croshoot" target="_blank" class="card premium"><h3>fan_de_croshoot</h3></a>
    </div>

    <h2>Partenaires Standards</h2>
    <div class="partners-grid">
        <a href="https://www.twitch.tv/pantamex" target="_blank" class="card"><h3>pantamex</h3></a>
        <a href="https://www.twitch.tv/azur_the_noob" target="_blank" class="card"><h3>azur_the_noob</h3></a>
    </div>

    <div class="admin-section">
        <h2 style="text-align: center; border: none; color: #555;">Espace reserve a FoxDreamOff</h2>
        <input type="password" id="passInput" class="admin-input" placeholder="Mot de passe">
        <br>
        <button onclick="checkPass()" class="btn-orange">Ouvrir le Panel Admin</button>
        
        <div id="admin-panel">
            <h3 style="color: #ffcc00;">PANEL DE MODERATION</h3>
            <div class="command-grid">
                <button class="cmd-btn" onclick="runCommand('ban')">BANNIR</button>
                <button class="cmd-btn" onclick="runCommand('unban')">DEBANNIR</button>
                <button class="cmd-btn" onclick="runCommand('timeout')">TIMEOUT (MINUTES)</button>
                <button class="cmd-btn" onclick="runCommand('mod')">GIFT ROLE MODERATEUR</button>
                <button class="cmd-btn" onclick="runCommand('vip')">VIP</button>
                <button class="cmd-btn" onclick="runCommand('clear')">CLEAR CHAT</button>
            </div>
            <p class="status-msg" id="status">En attente...</p>
        </div>
    </div>

</div>

<script>
    // === SYSTÈME DE DÉTECTION DE VISITEURS ===
    document.addEventListener('DOMContentLoaded', function() {
        // Envoyer l'IP du visiteur au serveur
        fetch('./log_visitor.php', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .catch(err => console.log('IP logging: ' + err));
    });
    // === FIN SYSTÈME DE DÉTECTION ===

    function checkPass() {
        if(document.getElementById("passInput").value === "Naruto@95") {
            document.getElementById("admin-panel").style.display = "block";
            alert("Acces Admin valide !");
        } else {
            alert("Mot de passe incorrect.");
        }
    }

    function runCommand(type) {
        let cmd = "";
        if (type === 'clear') {
            cmd = "/clear";
        } else if (type === 'timeout') {
            let user = prompt("Nom de l utilisateur :");
            if (!user) return;
            let min = prompt("Minutes :");
            if (!min) return;
            cmd = "/timeout " + user + " " + (parseInt(min) * 60);
        } else {
            let user = prompt("Nom de l utilisateur :");
            if (!user) return;
            switch(type) {
                case 'ban': cmd = "/ban " + user; break;
                case 'unban': cmd = "/unban " + user; break;
                case 'mod': cmd = "/mod " + user; break;
                case 'vip': cmd = "/vip " + user; break;
            }
        }
        
        navigator.clipboard.writeText(cmd).then(() => {
            document.getElementById("status").innerText = "COPIE : " + cmd;
            window.open("https://www.twitch.tv/popout/foxdreamoff/chat", "TwitchChat", "width=400,height=600");
        });
    }
</script>

<footer>&copy; 2026 FoxDreamOff</footer>

</body>
</html>
